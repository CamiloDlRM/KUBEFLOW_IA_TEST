version: "3.9"

services:
  # ---------- PostgreSQL ----------
  postgres:
    image: postgres:16-alpine
    container_name: mlops-postgres
    environment:
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops
      POSTGRES_DB: mlops
    expose:
      - 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mlops-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mlops -d mlops" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Backend API ----------
  backend:
    build: ./backend
    container_name: mlops-backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://mlops:mlops@postgres:5432/mlops
    volumes:
      - mlops-models:/app/model_artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
    networks:
      - mlops-network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------- Celery Worker ----------
  worker:
    build: ./backend
    container_name: mlops-worker
    command: celery -A tasks.celery_tasks worker --loglevel=info -Q pipelines,celery --concurrency=2
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://mlops:mlops@postgres:5432/mlops
      - PYTHONPATH=/app
    volumes:
      - mlops-models:/app/model_artifacts
      - mlflow-data:/mlflow
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
    networks:
      - mlops-network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: mlops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - mlops-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3

  # ---------- MLflow ----------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: mlops-mlflow
    ports:
      - "5000:5000"
    command: >
      mlflow server
        --host 0.0.0.0
        --backend-store-uri sqlite:///mlflow/mlflow.db
        --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow-data:/mlflow
    networks:
      - mlops-network
    restart: unless-stopped

  # ---------- Model Server ----------
  model-server:
    build: ./model-server
    container_name: mlops-model-server
    ports:
      - "8001:8001"
    env_file: .env
    volumes:
      - mlops-models:/app/model_artifacts
      - mlflow-data:/mlflow
    depends_on:
      mlflow:
        condition: service_started
    networks:
      - mlops-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')" ]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------- Mailhog (dev SMTP) ----------
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mlops-mailhog
    expose:
      - 1025   # SMTP (internal only — backend connects here)
    ports:
      - "8025:8025"   # Web UI: http://localhost:8025
    networks:
      - mlops-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
        - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:8000}
    container_name: mlops-frontend
    ports:
      - "3000:80"
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mlops-network
    restart: unless-stopped

networks:
  mlops-network:
    driver: bridge

volumes:
  mlops-models:
  mlflow-data:
  redis-data:
  postgres-data:
