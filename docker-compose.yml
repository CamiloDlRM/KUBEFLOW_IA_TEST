services:
  # ---------- PostgreSQL ----------
  postgres:
    image: postgres:16-alpine
    container_name: mlops-postgres
    environment:
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops
      POSTGRES_DB: mlops
    expose:
      - 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mlops-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mlops -d mlops" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- MinIO (S3-compatible object storage) ----------
  # Stores two things:
  #   - user-uploaded datasets   -> bucket ${MINIO_BUCKET_DATASETS} (default "datasets")
  #   - MLflow run artifacts     -> bucket ${MINIO_BUCKET_MLFLOW}   (default "mlflow")
  # This replaces the shared local volume that used to hold MLflow artifacts,
  # which is not portable to Kubernetes.
  minio:
    image: minio/minio:latest
    container_name: mlops-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console: http://localhost:9001
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    networks:
      - mlops-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------- MinIO bucket bootstrap (runs once, then exits) ----------
  # Idempotent: `mc mb --ignore-existing` is a no-op when the bucket exists.
  minio-init:
    image: minio/mc:latest
    container_name: mlops-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET_DATASETS=${MINIO_BUCKET_DATASETS:-datasets}
      - MINIO_BUCKET_MLFLOW=${MINIO_BUCKET_MLFLOW:-mlflow}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          echo "waiting for minio..."
          sleep 2
        done
        mc mb --ignore-existing "local/$$MINIO_BUCKET_DATASETS"
        mc mb --ignore-existing "local/$$MINIO_BUCKET_MLFLOW"
        mc ls local
        echo "minio buckets ready"
    networks:
      - mlops-network
    restart: "no"

  # ---------- Backend API ----------
  backend:
    build: ./backend
    container_name: mlops-backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://mlops:mlops@postgres:5432/mlops
      # S3 / MinIO credentials (boto3 + mlflow client)
      - MLFLOW_S3_ENDPOINT_URL=${MINIO_ENDPOINT:-http://minio:9000}
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - AWS_DEFAULT_REGION=${MINIO_REGION:-us-east-1}
    volumes:
      - mlops-models:/app/model_artifacts
      # The same dashboard JSON Grafana is provisioned from. The backend reads
      # it to build the allow-list of queries a non-admin may run through the
      # Grafana proxy (core/grafana_queries.py), so both sides stay in sync
      # from one source of truth.
      - ./grafana/dashboards:/app/grafana_dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mlflow:
        condition: service_started
    networks:
      - mlops-network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      # Lets the container reach an Ollama server running on the Docker host
      # via http://host.docker.internal:11434 (needed on Linux).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------- Celery Worker ----------
  worker:
    build: ./backend
    container_name: mlops-worker
    command: celery -A tasks.celery_tasks worker --loglevel=info -Q pipelines,celery --concurrency=2
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://mlops:mlops@postgres:5432/mlops
      - PYTHONPATH=/app
      # The worker downloads datasets from MinIO and logs MLflow artifacts to S3.
      - MLFLOW_S3_ENDPOINT_URL=${MINIO_ENDPOINT:-http://minio:9000}
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - AWS_DEFAULT_REGION=${MINIO_REGION:-us-east-1}
    volumes:
      - mlops-models:/app/model_artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mlflow:
        condition: service_started
    networks:
      - mlops-network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      # The worker is the one that actually calls the AI advisor provider.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ---------- Ollama (optional, for AI_ADVISOR_PROVIDER=ollama) ----------
  # Uncomment to run Ollama as a compose service instead of on the host,
  # and set OLLAMA_BASE_URL=http://ollama:11434 in .env.
  # After starting, pull a model once:  docker compose exec ollama ollama pull llama3.1
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: mlops-ollama
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   networks:
  #     - mlops-network
  #   restart: unless-stopped

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: mlops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - mlops-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3

  # ---------- MLflow ----------
  # Backend store: SQLite on the `mlflow-data` volume (unchanged, keeps run history).
  # Artifact store: MinIO bucket `mlflow` (was a local path on the same volume).
  # boto3 is installed at startup because the official MLflow image ships without
  # the S3 extra; the pin matches backend/requirements.txt.
  mlflow:
    # Built locally so boto3 (S3 support) is baked into the image instead of
    # pip-installed on every container start — see mlflow/Dockerfile.
    build: ./mlflow
    container_name: mlops-mlflow
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_S3_ENDPOINT_URL=${MINIO_ENDPOINT:-http://minio:9000}
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - AWS_DEFAULT_REGION=${MINIO_REGION:-us-east-1}
    command:
      - /bin/sh
      - -c
      - |
        exec mlflow server \
          --host 0.0.0.0 \
          --backend-store-uri sqlite:///mlflow/mlflow.db \
          --default-artifact-root "s3://${MINIO_BUCKET_MLFLOW:-mlflow}/"
    volumes:
      # Only holds mlflow.db now — artifacts live in MinIO.
      - mlflow-data:/mlflow
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - mlops-network
    restart: unless-stopped

  # ---------- Model Server ----------
  model-server:
    build: ./model-server
    container_name: mlops-model-server
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      # Artifacts are downloaded from MinIO instead of a shared volume.
      - MLFLOW_S3_ENDPOINT_URL=${MINIO_ENDPOINT:-http://minio:9000}
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - AWS_DEFAULT_REGION=${MINIO_REGION:-us-east-1}
    volumes:
      - mlops-models:/app/model_artifacts
    depends_on:
      minio:
        condition: service_healthy
      mlflow:
        condition: service_started
    networks:
      - mlops-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')" ]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------- Mailhog (dev SMTP) ----------
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mlops-mailhog
    expose:
      - 1025   # SMTP (internal only — backend connects here)
    ports:
      - "8025:8025"   # Web UI: http://localhost:8025
    networks:
      - mlops-network
    restart: unless-stopped

  # ---------- Hospital Information System (simulated data source) ----------
  #
  # NOT part of the platform. It stands in for the transactional system a
  # hospital already runs, so the ingestion has a realistic external source to
  # extract from. Deliberately a separate container with its own credentials:
  # the platform reaches it over the network like any third-party system, and
  # cannot quietly share a connection with its own database.
  #
  # See hospital/README.md.
  hospital-db:
    image: postgres:16-alpine
    container_name: mlops-hospital-db
    environment:
      - POSTGRES_USER=${HOSPITAL_DB_USER:-hospital}
      - POSTGRES_PASSWORD=${HOSPITAL_DB_PASSWORD:-hospital}
      - POSTGRES_DB=${HOSPITAL_DB_NAME:-hospital}
    ports:
      # Published so the data can be inspected with psql or a GUI while
      # developing the ingestion. Not on 5432: that is the platform's own.
      - "5433:5432"
    volumes:
      - hospital-data:/var/lib/postgresql/data
    networks:
      - mlops-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${HOSPITAL_DB_USER:-hospital}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Loads Synthea's synthetic records, degrades the clinical free text and
  # drops the code on a share of rows. Runs once and exits; idempotent, so it
  # is safe to leave in the default `up`.
  hospital-init:
    build: ./hospital
    container_name: mlops-hospital-init
    environment:
      - HOSPITAL_DB_URL=postgresql://${HOSPITAL_DB_USER:-hospital}:${HOSPITAL_DB_PASSWORD:-hospital}@hospital-db:5432/${HOSPITAL_DB_NAME:-hospital}
      - SYNTHEA_SEED=${SYNTHEA_SEED:-20260911}
      - UNCODED_FRACTION=${UNCODED_FRACTION:-0.40}
    depends_on:
      hospital-db:
        condition: service_healthy
    networks:
      - mlops-network
    # A loader that has finished is not a crashed loader.
    restart: "no"

  # ---------- Prometheus (operational metrics) ----------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: mlops-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - mlops-network
    restart: unless-stopped

  # ---------- Grafana (dashboards, embedded in the app) ----------
  # Authentication is delegated to the backend: it validates the user's JWT and
  # forwards the identity in the auth-proxy header. Grafana is NOT published
  # with its own login — users always reach it proxied through /grafana.
  grafana:
    image: grafana/grafana:11.3.1
    container_name: mlops-grafana
    environment:
      # Served under the backend's /grafana path.
      - GF_SERVER_ROOT_URL=${BACKEND_PUBLIC_URL:-http://localhost:8000}/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # Embedding inside our own SPA.
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_COOKIE_SAMESITE=lax
      # Trust the backend's identity header; everything else is disabled so
      # Grafana cannot be reached with its own credentials.
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=${GRAFANA_AUTH_PROXY_HEADER:-X-WEBAUTH-USER}
      - GF_AUTH_PROXY_HEADER_PROPERTY=username
      - GF_AUTH_PROXY_AUTO_SIGN_UP=true
      - GF_AUTH_PROXY_SYNC_TTL=60
      - GF_AUTH_PROXY_WHITELIST=${GRAFANA_PROXY_WHITELIST:-}
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # Auto-provisioned users get Viewer, so they cannot *save* an edited
      # panel. Note that Viewer can still *run* arbitrary datasource queries,
      # so this role alone does not keep tenants apart: the backend proxy
      # enforces that (core/grafana_queries.py).
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
      # Datasource credentials (read-only DB user is created by db-init).
      - MLOPS_DB_HOST=postgres:5432
      - MLOPS_DB_NAME=mlops
      - MLOPS_GRAFANA_DB_USER=${GRAFANA_DB_USER:-grafana_ro}
      - MLOPS_GRAFANA_DB_PASSWORD=${GRAFANA_DB_PASSWORD:-grafana_ro}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mlops-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
        - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:8000}
    container_name: mlops-frontend
    ports:
      - "3000:80"
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mlops-network
    restart: unless-stopped

networks:
  mlops-network:
    driver: bridge

volumes:
  mlops-models:
  mlflow-data:      # MLflow SQLite backend store (artifacts now live in MinIO)
  minio-data:       # MinIO object storage (datasets + mlflow buckets)
  redis-data:
  postgres-data:
  grafana-data:     # Grafana internal DB (users auto-created by auth proxy)
  prometheus-data:  # Prometheus TSDB
  hospital-data:    # Simulated HIS — the ingestion's external source
  # Uncomment together with the ollama service above:
  # ollama-data:
