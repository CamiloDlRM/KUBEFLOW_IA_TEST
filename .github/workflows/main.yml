name: unit_and_integration_tests_dev

on:
  pull_request:
    branches: [ dev ]

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Updating and Installing dependencies
        run: sudo apt update && sudo apt install python3 python3-pip -y

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
                        ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Executting test
        working-directory: backend
        run: pytest tests/ --cov=. --cov-report=term-missing -v
        
  test-frontend:
    runs-on: ubuntu-22.04
    container:
      image: node:18-alpine
    needs: test-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Installing dependencies
        working-directory: frontend
        run: npm install 

      - name: Executing the frontend test with coverage
        working-directory: frontend
        run: npm run test:coverage
                
        
