name: unit_and_integration_tests_dev

on:
  pull_request:
    branches: [ dev ]

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Updating and Installing dependencies
        run: sudo apt update && sudo apt install python3 python3-pip -y

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
                        ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Executting test
        working-directory: backend
        run: pytest tests/ --cov=. --cov-report=term-missing -v
        
  test-frontend:
    runs-on: ubuntu-22.04
    container:
      image: node:20-alpine
    needs: test-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Installing dependencies
        working-directory: frontend
        run: npm install 

      - name: Executing the frontend test with coverage
        working-directory: frontend
        run: npm run test:coverage

  # The UI against the fake backend of tests/e2e/fixtures/api.ts: every route,
  # its main flow, its errors and its permissions. No services needed.
  test-e2e-mock:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck the e2e suite
        run: npm run typecheck:e2e

      - name: Run the mock e2e suite
        run: npm run test:e2e:mock

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mock
          path: frontend/playwright-report
          retention-days: 7

  # The UI against the real stack of docker-compose.e2e.yml (backend, postgres,
  # redis, minio, mlflow; no worker, GitHub or AI), seeded by
  # backend/scripts/seed_e2e.py.
  test-e2e-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start the e2e stack
        run: docker compose -f docker-compose.e2e.yml -p mlops-e2e up -d --build --wait --wait-timeout 300 frontend

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the smoke e2e suite
        working-directory: frontend
        run: npm run test:e2e:smoke

      - name: Stack logs
        if: ${{ failure() }}
        run: docker compose -f docker-compose.e2e.yml -p mlops-e2e logs --no-color

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: frontend/playwright-report
          retention-days: 7

      - name: Stop the e2e stack
        if: ${{ always() }}
        run: docker compose -f docker-compose.e2e.yml -p mlops-e2e down -v
