name: unit_and_integration_tests_dev

on:
  pull_request:
    branches: [ dev ]

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Updating and Installing dependencies
        run: sudo apt update && sudo apt install python3 python3-pip -y

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
                        ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Executting test
        working-directory: backend
        run: pytest tests/ --cov=. --cov-report=term-missing -v
        
  test-frontend:
    runs-on: ubuntu-22.04
    container:
      image: node:20-alpine
    needs: test-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Installing dependencies
        working-directory: frontend
        run: npm install 

      - name: Executing the frontend test with coverage
        working-directory: frontend
        run: npm run test:coverage

  # Every page of the UI against a fake API (frontend/tests/e2e/mock).
  test-e2e-mock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck the e2e suite
        run: npm run typecheck:e2e

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the mock e2e suite
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-mock-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # A few flows against the real stack: backend, postgres, redis, minio, mlflow
  # (docker-compose.e2e.yml). No GitHub, no AI provider.
  test-e2e-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -p mlops-e2e -f docker-compose.yml -f docker-compose.e2e.yml
      BASE_URL: http://localhost:3000
      E2E_API_URL: http://localhost:8000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Polled rather than `up --wait`: minio-init is a one-shot container that
      # exits once the buckets exist, which `--wait` can count as a failure.
      - name: Start the stack
        run: |
          cp .env.example .env
          $COMPOSE up -d --build backend
          for i in $(seq 1 120); do curl -sf http://localhost:8000/health > /dev/null && exit 0; sleep 5; done
          $COMPOSE ps; $COMPOSE logs --no-color backend; exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build and serve the frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000
          VITE_WS_URL: ws://localhost:8000
        run: |
          npm run build
          nohup npx vite preview --port 3000 --strictPort > vite-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000 > /dev/null && exit 0; sleep 1; done
          cat vite-preview.log; exit 1

      - name: Run the smoke e2e suite
        working-directory: frontend
        run: npm run test:e2e:smoke

      - name: Collect the stack's logs
        if: failure()
        run: |
          mkdir -p frontend/test-results
          $COMPOSE logs --no-color > frontend/test-results/compose.log 2>&1 || true

      - name: Upload the Playwright report and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v
